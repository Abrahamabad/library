databases:
  - name: librarypro-db
    databaseName: librarypro
    user: librarypro
    plan: free
    region: singapore

services:
  - type: web
    name: librarypro
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      python -m zipfile -e librarypro-source.zip .
      && python -c "import os; assert os.path.isdir('librarypro'), 'source archive extraction failed'"
      && pip install -r requirements.txt
      && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn librarypro.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: librarypro-db
          property: connectionString

databases:
  - name: librarypro-db
    databaseName: librarypro
    user: librarypro
    plan: free
    region: singapore

services:
  - type: web
    name: librarypro
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      python -m zipfile -e librarypro-source.zip .
      && python -c "import os; assert os.path.isdir('librarypro'), 'source archive extraction failed'"
      && pip install -r requirements.txt
      && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate &&
      python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; username=os.environ.get("DJANGO_BOOTSTRAP_ADMIN_USERNAME"); password=os.environ.get("DJANGO_BOOTSTRAP_ADMIN_PASSWORD"); User=get_user_model(); username and password and (User.objects.filter(username=username).exists() or User.objects.create_superuser(username, "", password))' &&
      gunicorn librarypro.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: librarypro-db
          property: connectionString
      - key: DJANGO_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: DJANGO_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
